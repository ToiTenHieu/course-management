spring.application.name=course-management
app.recovery.mode=${PASSWORD_RESET_MODE:disabled}
app.recovery.public-base-url=${PASSWORD_RESET_BASE_URL:}
app.recovery.from-address=${PASSWORD_RESET_FROM:}
spring.mail.properties[mail.smtp.connectiontimeout]=5000
spring.mail.properties[mail.smtp.timeout]=5000
spring.mail.properties[mail.smtp.writetimeout]=5000
spring.servlet.multipart.max-file-size=${LESSON_MAX_FILE_SIZE:20MB}
spring.servlet.multipart.max-request-size=${LESSON_MAX_REQUEST_SIZE:21MB}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/course_management}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
server.port=${PORT:8080}
server.servlet.session.timeout=${SESSION_TIMEOUT:30m}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
spring.thymeleaf.check-template-location=false
app.demo.password=${DEMO_PASSWORD:Demo123!}
app.demo.email-domain=${DEMO_EMAIL_DOMAIN:example.invalid}
