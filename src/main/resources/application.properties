spring.application.name=hoc-vien
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/course_management}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
server.port=${PORT:8080}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
spring.thymeleaf.check-template-location=false
app.bank.name=${BANK_NAME:Ng\u00e2n h\u00e0ng demo}
app.bank.account-number=${BANK_ACCOUNT:DEMO-000001}
app.bank.account-holder=${BANK_HOLDER:HOC VIEN DEMO}
