<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hồ sơ của tôi — Course Management</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="app-shell">
    <aside class="sidebar">
        <div class="sidebar-brand">
            <div class="mark">CM</div>
            <span>Course Management</span>
        </div>

        <nav class="sidebar-nav">
            <a href="/dashboard.html" class="item">
                <span class="icon">&#9632;</span> Tổng quan
            </a>
            <a href="/courses.html" class="item">
                <span class="icon">&#128218;</span> Khóa học
            </a>
            <a href="/my-courses.html" class="item" id="myCoursesNavItem" style="display:none;">
                <span class="icon">&#127891;</span> Khóa học của tôi
            </a>
            <a href="/users.html" class="item" id="usersNavItem" style="display:none;">
                <span class="icon">&#128101;</span> Người dùng
            </a>
            <a href="/notifications.html" class="item" id="notifNavItem">
                <span class="icon">&#128276;</span> Thông báo <span class="nav-badge" id="notifBadge" style="display:none;"></span>
            </a>
            <a href="/reports.html" class="item" id="reportsNavItem" style="display:none;">
                <span class="icon">&#128200;</span> Báo cáo
            </a>
        </nav>

        <div class="sidebar-footer">
            <a href="/profile.html" class="sidebar-user" style="text-decoration:none; cursor:pointer;">
                <div class="avatar" id="avatarInitials">--</div>
                <div class="meta">
                    <div class="name" id="sideUserName">Đang tải...</div>
                    <div class="role" id="sideUserRole">—</div>
                </div>
            </a>
            <button class="sidebar-logout" id="logoutBtn">Đăng xuất</button>
        </div>
    </aside>

    <main class="main">
        <div class="page-header">
            <h1>Hồ sơ của tôi</h1>
            <p>Cập nhật thông tin cá nhân và mật khẩu đăng nhập.</p>
        </div>

        <div id="loadingLine" class="loading-line">Đang tải hồ sơ...</div>

        <div id="content" style="display:none;">
            <div class="panel">
                <div class="panel-header">
                    <h2>Thông tin cá nhân</h2>
                    <span class="badge accent" id="roleBadge">—</span>
                </div>
                <div class="panel-body" style="padding: 18px 20px;">
                    <div class="banner-error" id="profileError"></div>
                    <form id="profileForm">
                        <label for="pUsername">Tên đăng nhập</label>
                        <input type="text" id="pUsername" disabled style="background:#F5F6FA; color: var(--color-text-muted);">

                        <label for="pFullName">Họ và tên</label>
                        <input type="text" id="pFullName">

                        <label for="pEmail">Email</label>
                        <input type="text" id="pEmail">

                        <button type="submit" class="primary width-auto" id="profileSubmitBtn">Lưu thay đổi</button>
                    </form>
                </div>
            </div>

            <div class="panel">
                <div class="panel-header">
                    <h2>Đổi mật khẩu</h2>
                </div>
                <div class="panel-body" style="padding: 18px 20px;">
                    <div class="banner-error" id="passwordError"></div>
                    <form id="passwordForm">
                        <label for="oldPassword">Mật khẩu hiện tại</label>
                        <input type="password" id="oldPassword" placeholder="Nhập mật khẩu hiện tại">

                        <label for="newPassword">Mật khẩu mới</label>
                        <input type="password" id="newPassword" placeholder="Tối thiểu 6 ký tự">

                        <button type="submit" class="primary width-auto" id="passwordSubmitBtn">Đổi mật khẩu</button>
                    </form>
                </div>
            </div>
        </div>
    </main>
</div>

<div class="toast" id="toast"></div>

<script src="/js/api.js"></script>
<script>
    let myUserId = null;

    function initials(name) {
        if (!name) return '--';
        const parts = name.trim().split(/\s+/);
        return ((parts[0]||'')[0]||'').toUpperCase() + ((parts[parts.length-1]||'')[0]||'').toUpperCase();
    }

    function showToast(message, type = 'success') {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.className = 'toast show ' + type;
        setTimeout(() => { toast.className = 'toast ' + type; }, 2600);
    }

    (async () => {
        const profile = await requireAuth();
        if (!profile) return;

        myUserId = profile.userId;

        document.getElementById('loadingLine').style.display = 'none';
        document.getElementById('content').style.display = 'block';

        document.getElementById('avatarInitials').textContent = initials(profile.fullName);
        document.getElementById('sideUserName').textContent = profile.fullName;
        document.getElementById('sideUserRole').textContent = roleLabel(profile.role);
        document.getElementById('roleBadge').textContent = roleLabel(profile.role);

        document.getElementById('pUsername').value = profile.username;
        document.getElementById('pFullName').value = profile.fullName;
        document.getElementById('pEmail').value = profile.email;

        if (profile.role === 'ADMIN') {
            document.getElementById('usersNavItem').style.display = 'flex';
        }
        if (profile.role === 'STUDENT') {
            document.getElementById('myCoursesNavItem').style.display = 'flex';
        }
    })();

    document.getElementById('profileForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const submitBtn = document.getElementById('profileSubmitBtn');
        const errorBanner = document.getElementById('profileError');
        errorBanner.classList.remove('show');

        const fullName = document.getElementById('pFullName').value.trim();
        const email = document.getElementById('pEmail').value.trim();

        submitBtn.disabled = true;
        submitBtn.textContent = 'Đang lưu...';

        const result = await Api.updateUserProfile(myUserId, fullName, email);

        submitBtn.disabled = false;
        submitBtn.textContent = 'Lưu thay đổi';

        if (result.ok) {
            showToast('Cập nhật hồ sơ thành công');
            document.getElementById('sideUserName').textContent = fullName;
        } else {
            errorBanner.textContent = result.body.message || 'Cập nhật thất bại';
            errorBanner.classList.add('show');
        }
    });

    document.getElementById('passwordForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const submitBtn = document.getElementById('passwordSubmitBtn');
        const errorBanner = document.getElementById('passwordError');
        errorBanner.classList.remove('show');

        const oldPassword = document.getElementById('oldPassword').value;
        const newPassword = document.getElementById('newPassword').value;

        if (!newPassword || newPassword.length < 6) {
            errorBanner.textContent = 'Mật khẩu mới phải từ 6 ký tự';
            errorBanner.classList.add('show');
            return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = 'Đang xử lý...';

        const result = await Api.changePassword(myUserId, oldPassword, newPassword);

        submitBtn.disabled = false;
        submitBtn.textContent = 'Đổi mật khẩu';

        if (result.ok) {
            showToast('Đổi mật khẩu thành công');
            document.getElementById('passwordForm').reset();
        } else {
            errorBanner.textContent = result.body.message || 'Đổi mật khẩu thất bại';
            errorBanner.classList.add('show');
        }
    });

    document.getElementById('logoutBtn').addEventListener('click', async () => {
        await Api.logout();
        window.location.href = '/login.html';
    });
</script>
</body>
</html>
