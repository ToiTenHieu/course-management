<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Khóa học của tôi — Course Management</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="app-shell">
    <aside class="sidebar">
        <div class="sidebar-brand">
            <div class="mark">CM</div>
            <span>Course Management</span>
        </div>

        <nav class="sidebar-nav">
            <a href="/dashboard.html" class="item">
                <span class="icon">&#9632;</span> Tổng quan
            </a>
            <a href="/courses.html" class="item">
                <span class="icon">&#128218;</span> Khóa học
            </a>
            <a href="/my-courses.html" class="item active">
                <span class="icon">&#127891;</span> Khóa học của tôi
            </a>
            <a href="/notifications.html" class="item" id="notifNavItem">
                <span class="icon">&#128276;</span> Thông báo <span class="nav-badge" id="notifBadge" style="display:none;"></span>
            </a>
            <a href="/payments.html" class="item" id="paymentsNavItem" style="display:none;">
                <span class="icon">&#128179;</span> Thanh toán
            </a>
            <a href="/my-payments.html" class="item" id="myPaymentsNavItem" style="display:none;">
                <span class="icon">&#128179;</span> Thanh toán của tôi
            </a>
        </nav>

        <div class="sidebar-footer">
            <a href="/profile.html" class="sidebar-user" style="text-decoration:none; cursor:pointer;">
                <div class="avatar" id="avatarInitials">--</div>
                <div class="meta">
                    <div class="name" id="sideUserName">Đang tải...</div>
                    <div class="role" id="sideUserRole">—</div>
                </div>
            </a>
            <button class="sidebar-logout" id="logoutBtn">Đăng xuất</button>
        </div>
    </aside>

    <main class="main">
        <div class="page-header">
            <h1>Khóa học của tôi</h1>
            <p>Các khóa học bạn đã đăng ký và tiến độ học tập.</p>
        </div>

        <div id="loadingLine" class="loading-line">Đang tải danh sách...</div>
        <div id="listWrap"></div>
        <div class="empty-state" id="emptyState" style="display:none;">
            Bạn chưa đăng ký khóa học nào. <a href="/courses.html">Xem danh sách khóa học &rarr;</a>
        </div>
    </main>
</div>

<script src="/js/api.js"></script>
<script>
    function initials(name) {
        if (!name) return '--';
        const parts = name.trim().split(/\s+/);
        return ((parts[0]||'')[0]||'').toUpperCase() + ((parts[parts.length-1]||'')[0]||'').toUpperCase();
    }

    function statusLabel(status) {
        if (status === 'COMPLETED') return 'Đã hoàn thành';
        if (status === 'DROPPED') return 'Đã hủy';
        return 'Đang học';
    }

    function statusBadgeClass(status) {
        if (status === 'COMPLETED') return 'success';
        if (status === 'DROPPED') return 'error';
        return 'accent';
    }

    function renderCard(enrollment) {
        const pct = parseFloat(enrollment.progressPercentage) || 0;
        const isComplete = pct >= 100;
        return `
            <div class="course-card">
                <div class="top-row">
                    <div>
                        <h3>${enrollment.courseTitle}</h3>
                        <div class="meta">Đăng ký ngày ${new Date(enrollment.enrollmentDate).toLocaleDateString('vi-VN')}</div>
                    </div>
                    <span class="badge ${statusBadgeClass(enrollment.status)}">${statusLabel(enrollment.status)}</span>
                </div>
                <div class="progress-row">
                    <div style="flex:1;" class="progress-track">
                        <div class="progress-fill ${isComplete ? 'complete' : ''}" style="width:${pct}%;"></div>
                    </div>
                    <span class="pct">${pct.toFixed(0)}%</span>
                </div>
                <div style="margin-top:12px;">
                    <a href="/course-detail.html?id=${enrollment.courseId}">Tiếp tục học &rarr;</a>
                </div>
            </div>
        `;
    }

    async function loadMyCourses() {
        const result = await Api.getMyEnrollments();
        document.getElementById('loadingLine').style.display = 'none';

        if (!result.ok) {
            document.getElementById('emptyState').textContent = result.body.message || 'Không tải được danh sách';
            document.getElementById('emptyState').style.display = 'block';
            return;
        }

        const enrollments = result.body.data || [];
        if (enrollments.length === 0) {
            document.getElementById('emptyState').style.display = 'block';
            return;
        }

        document.getElementById('listWrap').innerHTML = enrollments.map(renderCard).join('');
    }

    (async () => {
        const profile = await requireAuth();
        if (!profile) return;

        if (profile.role !== 'STUDENT') {
            window.location.href = '/dashboard.html';
            return;
        }

        document.getElementById('avatarInitials').textContent = initials(profile.fullName);
        document.getElementById('sideUserName').textContent = profile.fullName;
        document.getElementById('sideUserRole').textContent = roleLabel(profile.role);

        loadMyCourses();
    })();

    document.getElementById('logoutBtn').addEventListener('click', async () => {
        await Api.logout();
        window.location.href = '/login.html';
    });
</script>
</body>
</html>
